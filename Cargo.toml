[workspace]
members = [
    "crates/core",
    "crates/pe",
    "crates/disasm",
    "crates/tracer",
    "crates/packers/themida",
    "crates/packers/ahk_gto",
    "crates/cli",
    "crates/acceptance",
    "crates/antidebug",
    "crates/antidebug-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/guoxing2024/magicmida-rs"
license = "GPL-3.0-only"
readme = "README.md"
# Internal research workspace: no crate is published to crates.io, so
# path-only dependencies are legitimate (cargo-deny wildcard exemption).
publish = false

[workspace.dependencies]
iced-x86 = "1.21"
pelite = "0.10"
thiserror = "1"
tracing = "0.1"
anyhow = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
    "Wdk_System_Threading",
] }

# Clippy policy (2026-08 purification). Member crates inherit via
# `[lints] workspace = true`. Deliberately clippy-only: CI builds with
# RUSTFLAGS=-D warnings, so rustc-level lint changes could break `-D warnings`
# builds before the codebase is clean; clippy lints only fire under
# `cargo clippy`, which is not yet a CI gate.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "deny"
dbg_macro = "deny"
manual_let_else = "warn"
