[workspace]
members = [
    "crates/core",
    "crates/pe",
    "crates/disasm",
    "crates/tracer",
    "crates/packers/themida",
    "crates/packers/ahk_gto",
    "crates/cli",
    "crates/acceptance",
    "crates/antidebug",
    "crates/antidebug-runtime",
]
# Research-only; own Cargo.toml pins (no workspace inherit). Build with a
# separate research workspace or after moving out of tree — not via root members.
exclude = ["crates/bwhook"]
default-members = [
    "crates/core",
    "crates/pe",
    "crates/disasm",
    "crates/tracer",
    "crates/packers/themida",
    "crates/packers/ahk_gto",
    "crates/cli",
    "crates/acceptance",
    "crates/antidebug",
    "crates/antidebug-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/guoxing2024/magicmida-rs"
license = "GPL-3.0-only"
readme = "README.md"
# Internal research workspace: no crate is published to crates.io, so
# path-only dependencies are legitimate (cargo-deny wildcard exemption).
publish = false

[workspace.dependencies]
iced-x86 = "1.21"
pelite = "0.10"
thiserror = "1"
tracing = "0.1"
anyhow = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
] }
