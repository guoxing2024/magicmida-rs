name: ci

on:
  push:
    branches: [master, oreans/two-sample-mainline]
  pull_request:

# Least-privilege default for every job; jobs may only narrow further.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-quality:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target-quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-27
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Artifact policy hygiene
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_workspace_hygiene.ps1

  windows-build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: default
            check_command: cargo check --workspace --tests --locked
            test_command: cargo test --workspace --locked
          - lane: all-features
            check_command: cargo check --workspace --all-features --tests --locked
            test_command: cargo test --workspace --all-features --locked
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-27

      # `--locked` (not `--offline`): a fresh GitHub runner must download the
      # lockfile-pinned dependency set once. Local reproducibility checks use
      # the equivalent commands with `--offline` after dependencies exist.
      #
      # No `RUSTFLAGS: -D warnings` here: workspace lints already elevate
      # hygiene lints (print_stdout/dbg_macro = deny), and the remaining
      # warn-level lints (unwrap_used/expect_used/manual_let_else) are paid
      # down incrementally by the windows-clippy gate below — see its
      # phasing plan. Test-target unwraps are intentionally NOT a hard error
      # yet (they are cleared in the clippy batches, not by -D warnings,
      # which would also choke on legit test assertions).
      - name: Check workspace (${{ matrix.lane }})
        run: ${{ matrix.check_command }}

      - name: Test workspace (${{ matrix.lane }})
        run: ${{ matrix.test_command }}

  # Clippy gate, phased. The `-D` list grows one lint at a time as each
  # clippy batch is paid down (see archive/operations/reports/
  # CODE_REVIEW_AND_CLEANUP_PLAN_20260826.md for the batch plan):
  #
  #   phase 0 (this job, green now):  -D clippy::dbg_macro
  #     (already deny-level in [workspace.lints.clippy]; 0 violations)
  #   phase 1 (after clippy batch 1): + -D clippy::unwrap_used
  #     (unwrap_used must drop to <=5 residual, each with allow + reason)
  #   phase 2 (after clippy batch 2): + -D clippy::expect_used
  #   phase 3 (after clippy batch 3): + -D clippy::manual_let_else
  #   later phases: any lint promoted to deny in [workspace.lints.clippy]
  #     is mirrored here once the batch for it is fully paid down.
  #
  # Keep the phase list in sync with the workspace lint policy: a lint that
  # is deny-level in Cargo.toml but NOT in this `-D` list still fails the
  # build via rustc, so this job is the *progressive* gate for warn-level
  # lints only.
  windows-clippy:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target-clippy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-27
        with:
          components: clippy

      # Phase 0 gate: only dbg_macro is hard-failing for now. warn-level
      # lints are reported (not denied) until their batch is paid down.
      - name: Clippy (workspace, all targets) — phase 0
        run: cargo clippy --workspace --all-targets -- -D clippy::dbg_macro

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency governance (advisories, licenses, bans)
        uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
