name: ci

on:
  push:
    branches: [master, oreans/two-sample-mainline]
  pull_request:

# Least-privilege default for every job; jobs may only narrow further.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-quality:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target-quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-27
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Hard-coding gate (general-purpose policy)
        shell: powershell
        run: python tools\_hardcode_scan.py --gate

      - name: Artifact policy hygiene
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_workspace_hygiene.ps1

  windows-build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: default
            check_command: cargo check --workspace --tests --locked
            test_command: cargo test --workspace --locked
          - lane: all-features
            check_command: cargo check --workspace --all-features --tests --locked
            test_command: cargo test --workspace --all-features --locked
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-27

      # `--locked` (not `--offline`): a fresh GitHub runner must download the
      # lockfile-pinned dependency set once. Local reproducibility checks use
      # the equivalent commands with `--offline` after dependencies exist.
      #
      # No `RUSTFLAGS: -D warnings` here: workspace lints already elevate
      # hygiene lints (print_stdout/dbg_macro = deny), and the remaining
      # warn-level lints (unwrap_used/expect_used/manual_let_else) are paid
      # down incrementally by the windows-clippy gate below — see its
      # phasing plan. Test-target unwraps are intentionally NOT a hard error
      # yet (they are cleared in the clippy batches, not by -D warnings,
      # which would also choke on legit test assertions).
      - name: Check workspace (${{ matrix.lane }})
        run: ${{ matrix.check_command }}

      - name: Test workspace (${{ matrix.lane }})
        run: ${{ matrix.test_command }}

  # Clippy gate, phased. The `-D` list grows one lint at a time as each
  # clippy batch is paid down (see archive/operations/reports/
  # CODE_REVIEW_AND_CLEANUP_PLAN_20260826.md for the batch plan):
  #
  #   phase 0:  -D clippy::dbg_macro  (deny-level in workspace lints; 0)
  #   phase 1:  + -D clippy::unwrap_used  [ACTIVE since 2026-08-27, WO-10/12]
  #   phase 2:  + -D clippy::expect_used  [ACTIVE since 2026-08-27, WO-12]
  #   phase 3:  + -D clippy::manual_let_else  [ACTIVE since 2026-08-27, WO-15]
  #   later phases: any lint promoted to deny in [workspace.lints.clippy]
  #     is mirrored here once the batch for it is fully paid down.
  #
  # Test-policy note (WO-14): assertion-style .unwrap()/.expect() in test
  # code is idiomatic, not debt. cargo 1.97 has no `allow-in-tests` under
  # [workspace.lints.clippy] and cfg_attr(test, allow) does not apply to
  # test targets under clippy --all-targets (both verified). This gate
  # therefore checks PRODUCTION ONLY via `--lib --bins`; test targets are
  # never -D on these lints. Keep `--lib --bins` (not --all-targets) for
  # the unwrap/expect phases.
  #
  # Keep the phase list in sync with the workspace lint policy: a lint that
  # is deny-level in Cargo.toml but NOT in this `-D` list still fails the
  # build via rustc, so this job is the *progressive* gate for warn-level
  # lints only.
  windows-clippy:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target-clippy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-27
        with:
          components: clippy

      # Phases 0-3 gate: dbg_macro everywhere; unwrap_used/expect_used/
      # manual_let_else on production targets only (test targets stay
      # warn-level per WO-14).
      - name: Clippy (workspace, all targets) — phases 0-3
        run: |
          cargo clippy --workspace --all-targets -- -D clippy::dbg_macro
          cargo clippy --workspace --lib --bins -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::manual_let_else

      # WO-23 lint lock: warn-level lint counts must not regress. The
      # remaining ~405 production warnings (result_large_err 84, etc.) are
      # paid down in later batches (WO-24 targets result_large_err -> <=10);
      # each lowering updates `_clippy_baseline` in the same commit.
      # Baseline counts are MONOTONIC — a count above baseline fails here.
      # Test targets are excluded (--lib --bins only) per the WO-14 policy.
      - name: Clippy warn-baseline (WO-23)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check_clippy_baseline.ps1

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency governance (advisories, licenses, bans)
        uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
