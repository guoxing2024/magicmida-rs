[package]
name = "mida-antidebug-runtime"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "MIDA AntiDebug Compatibility Runtime - x64 runtime foundation (ADR-4): C ABI, attestation, telemetry, provenance"

# ADR-4: Windows x64 only. x86/ARM/kernel/hypervisor are explicitly out of scope.
# cdylib enables DLL export surface (built to out-of-tree target, never committed);
# rlib enables offline unit/integration tests of the same code without a DLL.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]

# The MSVC linker emits its normal stdout (creating .lib/.exp) in the
# process locale; rustc's linker_messages lint surfaces that noise as a
# warning on every cdylib link. It is not a code defect. Suppress at the
# crate level so the workspace build is warning-free (P6 gate 4).
[lints.rust]
linker_messages = "allow"
