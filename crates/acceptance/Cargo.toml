[package]
name = "mida-acceptance"
version.workspace = true
edition.workspace = true
description = "Independent acceptance kernel: static PE structural gates and deterministic reports"
repository.workspace = true
license.workspace = true
readme.workspace = true
publish.workspace = true

[[bin]]
name = "mida-acceptance"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"
