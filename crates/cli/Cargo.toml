[package]
name = "mida-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for Magicmida-RS"
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = []
# Deliberately off-mainline: enables the isolated AHK/GTO product-recovery route.
gto-product-recovery = ["dep:mida-packers-ahk-gto", "mida-packers-ahk-gto/gto-product-recovery"]

[dependencies]
mida-core = { path = "../core" }
mida-pe = { path = "../pe" }
mida-disasm = { path = "../disasm" }
mida-tracer = { path = "../tracer" }
mida-packers-themida = { path = "../packers/themida" }
mida-packers-ahk-gto = { path = "../packers/ahk_gto", default-features = false, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { workspace = true }
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
