[package]
name = "mida-packers-ahk-gto"
version = "0.1.0"
edition = "2021"
description = "AHK/GTO protection-family PackerPlugin (R4)"
repository = "https://github.com/guoxing2024/magicmida-rs"
license = "GPL-3.0-only"
readme = "../../../README.md"
# Internal research crate; never published (path-only dependencies).
publish = false

[features]
default = []
# Marks the heavyweight AHK/GTO product-recovery route. Identification and
# family routing are available in the default build (G0); this feature gates
# the recovery execution itself (independent GTO host, heap/container capture),
# which stays explicitly opt-in via `mida-cli --features gto-product-recovery`.
gto-product-recovery = []

[dependencies]
mida-core = { path = "../../core" }
tracing = "0.1"
