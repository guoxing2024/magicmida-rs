[package]
name = "mida-pe"
version.workspace = true
edition.workspace = true
description = "PE parsing, section operations, import table reconstruction"
repository.workspace = true
license.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
mida-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pelite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
windows = { workspace = true }
mida-disasm = { path = "../disasm" }
sha2 = "0.10"

[dev-dependencies]
iced-x86 = { workspace = true }
# Route V R0 (V0-E): capture stage-timing telemetry in offline Rust tests. This is
# a test-only dependency (mida-pe production must not gain tracing_subscriber).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
# R1-E dual-path corpus only: pure emit candidates judged by independent R0B gates.
# Production `mida-pe` must not depend on `mida-acceptance` (boundary is one-way).
mida-acceptance = { path = "../acceptance" }

# Inherit the workspace clippy policy (see root Cargo.toml).
[lints]
workspace = true
