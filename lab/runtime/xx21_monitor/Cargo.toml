[package]
name = "xx21_monitor"
version.workspace = true
edition.workspace = true
description = "XX-21 experiment monitor: page-level observation of a loaded candidate"
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "xx21_monitor"
path = "src/lib.rs"

[[bin]]
name = "xx21_monitor"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
