[package]
name = "host_loader"
version.workspace = true
edition.workspace = true
description = "XX-21 experiment host: loads a candidate DLL and drives its exports"
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "host_loader"
path = "src/lib.rs"

[[bin]]
name = "host_loader"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
] }
