[advisories]
version = 2
yanked = "deny"
# NOTE: cargo-deny >= 0.20 removed `severity-threshold` (PR #611); all
# advisories are now blocking via the default `vulnerability = "deny"` lint.

[licenses]
# NOTE: cargo-deny >= 0.20 removed `unlicensed` (PR #611); unlicensed crates
# must be resolved via `licenses.clarify` or `licenses.private`.
allow = [
    "MIT",
    "Apache-2.0",
    # Required by unicode-ident: "(MIT OR Apache-2.0) AND Unicode-3.0".
    "Unicode-3.0",
    # The workspace crates themselves are GPL-3.0-only.
    "GPL-3.0-only",
]
confidence-threshold = 0.8

[bans]
# NOTE: cargo-deny >= 0.20 dropped the per-table `version` key; the format
# version is implied by the top-level `config-version` where applicable.
multiple-versions = "deny"
wildcards = "deny"
# Workspace-internal path dependencies carry no version (path-only); permit
# those while still rejecting version wildcards from registries.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Deny-by-default list of crates known to cause supply-chain issues.
    { name = "openssl-sys" },
]
skip = [
    # syn 2.x and 3.x legitimately coexist in the current graph: the proc-macro
    # ecosystem is mid-transition (2.x is still the majority consumer ABI).
    # Revisit and remove this exemption once the graph converges on syn 3.
    { name = "syn" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
